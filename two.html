<!-- border vs outline
    border is a part of box model
    Increases the element's overall size
    outline-Drawn outside the border.
    Does not change the element's dimensions or affect neighboring elements.
  -->
<body>
    <div style="height: 100px; width: 100px;
     background-color: deeppink;
     border: 3px solid black;
     outline: 4px solid blue;"

     > 
        
    </div>
</body>
