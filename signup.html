<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Signup</h1>
    <form>
        <label for="Email">Email</label><br>
        <input type="email" id="Email" placeholder="Enter your email">
        <br>
        <br>
        <label for="Phone No">Phone No.</label><br>
        <input type="number" id="Phone No" placeholder="Enter your Phone number">
        <br>
        <br>
        <label for="Father Name">Father Name</label><br>
        <input id="Father Name" placeholder="Enter your Father Name">
        <br>
        <br>
         <label for="Mother Name">Mother Name</label><br>
        <input id="Mother Name" placeholder="Enter your Mother Name">
        <br>
        <br>
        <label for="RollNo">RollNo.</label><br>
        <input type="number" id="RollNo" placeholder="Enter your RollNo">
        <br>
        <br>
        <label for="Address">Address</label><br>
        <input id="Address" placeholder="Enter your Address">
        <br>
        <br>
        <label for="DOB">DOB</label><br>
        <input type="date" id="DOB">
        <br>
        <br>
         <label for="GENDER"> GENDER</label>
    <label for="MALE">M</label>
    <input type="radio" id="Male" value="Male" name="GENDER" >
    <label for="Female">F</label>
    <input type="radio" id="Female" value="Female" name="GENDER" >
    <br>
    <br>
    <label for="Blood group">Blood group</label><br>
    <select id="Blood group" name="Blood group" required>
        <option value="" >Select</option>
        <option value="A+" >A+</option>
        <option value="A-" >A-</option>
        <option value="B+" >B+</option>
        <option value="B-" >B-</option>
        <option value="AB+" >AB+</option>
        <option value="AB-" >AB-</option>
        <option value="O+" >O+</option>
        <option value="O-" >O-</option>
    </select>
    <br>
    <br>
    <button type="submit">SUBMIT</button>
    <button type="reset">RESET</button>

    </form>
</body>
</html>
