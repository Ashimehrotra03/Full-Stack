<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<!-- line-height->
 controls the vertical space between lines of text.
 letter spacing->

  -->
<body>
    <div>line1line1line1</div>
    <div style="line-height: 1.5;"> LINE2</div>
    <div style="letter-spacing: 2px"> LINE3 LINE4</div>
    <div style="word-spacing: 5px;"> LINE4 LINE5</div>
    <br>
    <div style="text-transform: capitalize;">LINE5 LINE6</div>
    <div style="text-transform: uppercase;">LINE7 LINE8</div>
</body>
</html>
