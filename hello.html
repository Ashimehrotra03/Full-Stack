<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1">
        <thead>
            <tr>
                <th colspan="2">Product</th>
                <th rowspan="2">Qty</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="2">Apple</td>
                <td rowspan="2">2</td>
            </tr>
            <tr>
                <td>Mango</td>
                <td>4</td>
            </tr>
            <tr>
                <td>Grapes</td>
                <td>6</td>
            </tr>
            <tr>
                <td>Total</td>
                <td>12</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
